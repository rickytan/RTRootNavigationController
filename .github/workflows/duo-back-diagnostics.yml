name: Diagnose iPhone Duo back navigation

on:
  push:
    branches: [ "feature/iphone-duo-back-navigation" ]

permissions:
  contents: read

jobs:
  capture:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Install dependencies
        run: |
          bundle install
          bundle exec pod install --project-directory=Example
      - name: Select iPhone Duo
        id: simulator
        run: |
          DEVICE="$(xcrun simctl list devices available --json | jq -c '
            [.devices | to_entries[]
              | select(.key | startswith("com.apple.CoreSimulator.SimRuntime.iOS-27-"))
              | .value[] | select(.name == "iPhone Duo" and .isAvailable == true)]
            | first // empty
          ')"
          if [ -z "$DEVICE" ]; then
            echo "::error::No available iPhone Duo simulator running iOS 27 was found."
            exit 1
          fi
          echo "id=$(jq -r .udid <<< "$DEVICE")" >> "$GITHUB_OUTPUT"
          echo "state=$(jq -r .state <<< "$DEVICE")" >> "$GITHUB_OUTPUT"
      - name: Build Example app
        run: |
          xcodebuild \
            -workspace Example/RTRootNavigationController.xcworkspace \
            -scheme RTRootNavigationController-Example \
            -configuration Debug \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -derivedDataPath "$RUNNER_TEMP/example-build" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Boot iPhone Duo
        run: |
          DEVICE_ID='${{ steps.simulator.outputs.id }}'
          if [ '${{ steps.simulator.outputs.state }}' != "Booted" ]; then
            xcrun simctl boot "$DEVICE_ID"
          fi
          xcrun simctl bootstatus "$DEVICE_ID" -b
      - name: Capture back button variants
        run: |
          DEVICE_ID='${{ steps.simulator.outputs.id }}'
          APP="$RUNNER_TEMP/example-build/Build/Products/Debug-iphonesimulator/RTRootNavigationController_Example.app"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")"
          xcrun simctl install "$DEVICE_ID" "$APP"
          mkdir -p "$RUNNER_TEMP/back-captures"
          for scenario in default-auto default-vertical default-image default-image-vertical custom-auto custom-vertical system; do
            echo "Capturing $scenario"
            xcrun simctl launch --terminate-running-process "$DEVICE_ID" "$BUNDLE_ID" -RTBackScenario "$scenario"
            sleep 15
            xcrun simctl io "$DEVICE_ID" screenshot --display=1 "$RUNNER_TEMP/back-captures/$scenario.png"
          done
          xcrun simctl spawn "$DEVICE_ID" log show --style compact --last 20m \
            --predicate 'eventMessage CONTAINS "RTBackScenario"' > "$RUNNER_TEMP/back-captures/diagnostics.log"
      - name: Upload captures
        uses: actions/upload-artifact@v4
        with:
          name: duo-back-diagnostics
          path: ${{ runner.temp }}/back-captures/
          if-no-files-found: error
          retention-days: 7
