name: Xcode - Build and Analyze

on:
  push:
    branches:
      - "master"
      - "feature/**"
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    name: Build Example app (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iPhone Duo, iOS 27
            runner: xcode-27
            xcode: /Applications/Xcode_27.2.app/Contents/Developer
            destination: "platform=iOS Simulator,name=iPhone Duo,OS=latest"
          - name: iPhone 17, iOS 26
            runner: macos-26
            xcode: /Applications/Xcode_26.6.app/Contents/Developer
            destination: "platform=iOS Simulator,name=iPhone 17,OS=latest"
    env:
      DEVELOPER_DIR: ${{ matrix.xcode }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Install dependencies
        run: |
          bundle install
          bundle exec pod install --project-directory=Example
      - name: Build Example app
        run: |
          xcodebuild -version
          xcodebuild \
            -workspace Example/RTRootNavigationController.xcworkspace \
            -scheme RTRootNavigationController-Example \
            -destination '${{ matrix.destination }}' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Lint pod
        if: matrix.runner == 'xcode-27'
        run: bundle exec pod lib lint
